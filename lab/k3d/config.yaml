apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: clusterlens
servers: 1
agents: 2
image: rancher/k3s:v1.31.5-k3s1
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "6550"
options:
  k3d:
    wait: true
    timeout: "180s"
    disableLoadbalancer: true
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      - arg: "--disable=servicelb"
        nodeFilters:
          - server:*
      - arg: "--kubelet-arg=container-log-max-size=1Mi"
        nodeFilters:
          - server:*
          - agent:*
      - arg: "--kubelet-arg=container-log-max-files=2"
        nodeFilters:
          - server:*
          - agent:*
